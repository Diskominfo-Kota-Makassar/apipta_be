name: Build and Push Docker image

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: barongko/inspektorat_apipta:latest # Replace with your Docker Hub username and image name

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # Store the SSH password as a secret
          port: 22 # Or your custom SSH port
          script: |
            cd /home/satudata/docker
            docker rm -f be_apipta
            docker-compose -f apipta.yml pull
            docker-compose -f apipta.yml up -d
